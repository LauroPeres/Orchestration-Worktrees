# The shop catalog: every service of the project, with what each one needs (`infra`).
# `wt add <branch> --uses web` picks services per branch; their dependencies come along.
# Relative repo paths are relative to this file.
project: shop
domain: shop.localhost
repos: { api: ./shop-api, web: ./shop-web }
services:
  api:
    repo: api
    compose: docker-compose.yml
    port: 8000
    subdomain: api
    health: /healthz
    infra:
      postgres:
        databases: [shop]
        strategy: template
        verify: true
      kafka:
        groups: []
        topic_prefix: true
    env:
      DATABASE_URL: "{{ postgres.url('shop') }}"
      BRANCH: "{{ branch }}"
      WEB_ORIGIN: "{{ services.web.url }}"   # for CORS
      KAFKA_BOOTSTRAP: "{{ kafka.bootstrap }}"
      KAFKA_TOPIC: "{{ kafka.topic('items') }}"
  worker:
    repo: api
    compose: docker-compose.yml
    compose_service: worker
    infra:
      kafka:
        groups: [worker]
        topic_prefix: true
      redis: {}
    env:
      KAFKA_BOOTSTRAP: "{{ kafka.bootstrap }}"
      KAFKA_GROUP: "{{ kafka.group('worker') }}"
      KAFKA_TOPIC: "{{ kafka.topic('items') }}"
      REDIS_URL: "{{ redis.url }}"
      REDIS_PREFIX: "{{ redis.prefix }}"
  web:
    repo: web
    run: python3 server.py --port {{ port }}
    port: auto
    subdomain: ""
    consumes:
      api: API_URL                           # the API's public URL, injected as API_URL
    infra:
      keycloak: { realm: shop, client: web }
    env:
      BRANCH: "{{ branch }}"
      PUBLIC_URL: "{{ services.web.url }}"   # this page's own address, for the sign-in redirect
      KEYCLOAK_URL: "{{ keycloak.url }}"
      KEYCLOAK_REALM: "{{ keycloak.realm }}"
      KEYCLOAK_CLIENT_ID: "{{ keycloak.client_id }}"
