<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shop on __TITLE__</title>
<style>
  :root { --accent: __ACCENT__; --ink: #1c2230; --muted: #667085; --line: #e4e7ec; --bg: #f5f6f8; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  header { background: var(--accent); color: #fff; padding: 36px 24px 40px; }
  .wrap { max-width: 960px; margin: 0 auto; }
  .eyebrow { margin: 0; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
  h1 {
    margin: 4px 0 0; font-size: clamp(36px, 8vw, 64px); line-height: 1.1; font-weight: 700;
    overflow-wrap: anywhere;
  }
  main { max-width: 960px; margin: -20px auto 48px; padding: 0 24px; display: grid; gap: 24px;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  section { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 24px;
    box-shadow: 0 1px 3px rgba(16, 24, 40, .08); border-top: 4px solid var(--accent); }
  h2 { margin: 0 0 16px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  ul { margin: 0 0 20px; padding: 0; list-style: none; }
  li { padding: 8px 0; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  .empty { color: var(--muted); }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 10px 12px; font: inherit; border: 1px solid #c8cdd6; border-radius: 8px; }
  button { padding: 10px 18px; font: inherit; font-weight: 600; color: #fff; background: var(--accent);
    border: 0; border-radius: 8px; cursor: pointer; }
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 10px 16px; align-items: baseline; }
  dt { color: var(--muted); font-size: 14px; }
  dd { margin: 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 14px;
    overflow-wrap: anywhere; }
  .events { margin: 20px 0 16px; padding-top: 16px; border-top: 1px solid var(--line); display: flex;
    align-items: baseline; gap: 12px; }
  .events strong { font-size: 48px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
  .events span { color: var(--muted); }
  #status { margin: 16px 0 0; font-size: 13px; color: var(--muted); }
  #status.error { color: #b42318; }
  #sign-in-line { margin: 0 0 16px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header><div class="wrap">
  <p class="eyebrow">shop on branch</p>
  <h1 id="branch"></h1>
</div></header>
<main>
  <section>
    <h2>Items</h2>
    __SIGN_IN__
    <ul id="items"></ul>
    <form id="form">
      <input id="name" placeholder="item name" required>
      <button>Add</button>
    </form>
  </section>
  <section id="isolated">
    <h2>Isolated for this branch</h2>
    <dl>
      <dt>Database</dt><dd id="database">-</dd>
      <dt>Redis prefix</dt><dd id="redis-prefix">-</dd>
      <dt>Kafka topic</dt><dd id="kafka-topic">-</dd>
      <dt>Kafka group</dt><dd id="kafka-group">-</dd>
    </dl>
    <div class="events"><strong id="events">0</strong><span>Events received</span></div>
    <h2>Last items the worker consumed</h2>
    <ul id="recent"></ul>
    <p id="status">Waiting for the API...</p>
  </section>
</main>
<script>
const cfg = __CONFIG__;
const byId = (id) => document.getElementById(id);
byId("branch").textContent = cfg.branch;

function fill(list, values, emptyText) {
  list.replaceChildren();
  for (const value of values.length ? values : [emptyText]) {
    const li = document.createElement("li");
    li.textContent = value;
    if (!values.length) li.className = "empty";
    list.appendChild(li);
  }
}

async function load() {
  const rows = await (await fetch(cfg.apiUrl + "/items")).json();
  fill(byId("items"), rows.map((row) => row.name + ("quantity" in row ? " x" + row.quantity : "")), "No items yet");
}

async function refreshInfo() {
  const status = byId("status");
  try {
    const info = await (await fetch(cfg.apiUrl + "/info")).json();
    byId("database").textContent = info.database;
    byId("redis-prefix").textContent = info.redis_prefix;
    byId("kafka-topic").textContent = info.kafka_topic;
    byId("kafka-group").textContent = info.kafka_group;
    byId("events").textContent = info.events;
    fill(byId("recent"), info.recent, "Nothing consumed yet");
    status.textContent = "Live: refreshes every " + __REFRESH_MS__ / 1000 + " s";
    status.className = "";
  } catch (error) {
    status.textContent = "API unreachable; retrying";
    status.className = "error";
  }
}

byId("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  await fetch(cfg.apiUrl + "/items", {
    method: "POST",
    headers: {"content-type": "application/json"},
    body: JSON.stringify({name: byId("name").value}),
  });
  byId("name").value = "";
  load();
});
load();
refreshInfo();
setInterval(refreshInfo, __REFRESH_MS__);
</script>
</body>
</html>
